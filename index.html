<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Spotify Extreme Glass</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        :root {
            --spotify-green: #1ed760;
            --bg-base: #000000;
            --text-primary: #ffffff;
            --text-secondary: #a7a7a7;
            --safe-top: env(safe-area-inset-top, 20px);
            --safe-bottom: env(safe-area-inset-bottom, 20px);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        #loader {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9998;
            color: var(--spotify-green);
            font-weight: bold;
            font-size: 1.2rem;
        }

        ::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; -ms-overflow-style: none; }

        /* LIQUID GLASS EXTREME */
        .glass-extreme {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.02) 100%);
            backdrop-filter: blur(35px) saturate(200%) contrast(110%);
            -webkit-backdrop-filter: blur(35px) saturate(200%) contrast(110%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 
                0 20px 40px rgba(0,0,0,0.6),
                inset 0 1px 2px rgba(255,255,255,0.5),
                inset 0 -2px 4px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
        }

        .glass-extreme::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: skewX(-20deg);
            animation: shine 6s infinite;
        }

        .glass-nav-extreme {
            background: linear-gradient(to top, rgba(10, 10, 10, 0.95), rgba(30, 30, 30, 0.6));
            backdrop-filter: blur(40px) saturate(250%);
            -webkit-backdrop-filter: blur(40px) saturate(250%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top-color: rgba(255, 255, 255, 0.3);
            box-shadow: 
                0 -10px 40px rgba(0,0,0,0.8),
                inset 0 1px 0 rgba(255,255,255,0.2);
        }

        @keyframes shine {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .animate-slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }

        @keyframes slideDown {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-down { animation: slideDown 0.3s ease-out forwards; }

        .active-scale:active {
            transform: scale(0.94);
            transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .horizontal-scroll {
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }
        .horizontal-scroll > * { scroll-snap-align: start; }

        .text-shadow { text-shadow: 0 2px 4px rgba(0,0,0,0.6); }

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 14px; width: 14px; border-radius: 50%; background: white; cursor: pointer; margin-top: -5px; box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: rgba(255,255,255,0.2); border-radius: 2px; }
    </style>
</head>
<body>
    <div id="loader">Chargement...</div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- SVG ICONS ---
        const Svg = ({ children, size = 24, fill = "none", stroke = "currentColor", strokeWidth = 2, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke={stroke} strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );
        const Play = (p) => <Svg {...p}><polygon points="5 3 19 12 5 21 5 3"></polygon></Svg>;
        const Pause = (p) => <Svg {...p}><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></Svg>;
        const SkipBack = (p) => <Svg {...p}><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></Svg>;
        const SkipForward = (p) => <Svg {...p}><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></Svg>;
        const Shuffle = (p) => <Svg {...p}><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></Svg>;
        const Repeat = (p) => <Svg {...p}><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></Svg>;
        const HomeIcon = (p) => <Svg {...p}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></Svg>;
        const Search = (p) => <Svg {...p}><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></Svg>;
        const Library = (p) => <Svg {...p}><path d="m16 6 4 14"></path><path d="M12 6v14"></path><path d="M8 8v12"></path><path d="M4 4v16"></path></Svg>;
        const Plus = (p) => <Svg {...p}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></Svg>;
        const Menu = (p) => <Svg {...p}><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></Svg>;
        const ChevronLeft = (p) => <Svg {...p}><polyline points="15 18 9 12 15 6"></polyline></Svg>;
        const ChevronDown = (p) => <Svg {...p}><polyline points="6 9 12 15 18 9"></polyline></Svg>;
        const ListMusic = (p) => <Svg {...p}><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></Svg>;
        const MonitorSpeaker = (p) => <Svg {...p}><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></Svg>;
        const Mic2 = (p) => <Svg {...p}><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></Svg>;
        const Download = (p) => <Svg {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></Svg>;
        const MoreHorizontal = (p) => <Svg {...p}><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></Svg>;
        const Heart = (p) => <Svg {...p}><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></Svg>;
        const UserIcon = (p) => <Svg {...p}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></Svg>;

        // --- DATA ---
        const MOCK_TRACKS = [
            { id: 1, title: "Feu de bois", artist: "Damso", image: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=500&q=80", audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3", duration: "3:45", explicit: true },
            { id: 2, title: "Macarena", artist: "Damso", image: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=500&q=80", audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3", duration: "3:12", explicit: true },
            { id: 3, title: "Signaler", artist: "Damso", image: "https://images.unsplash.com/photo-1493225457124-a1a2a5f5c518?w=500&q=80", audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3", duration: "4:01", explicit: true },
            { id: 4, title: "J Respect R", artist: "Damso", image: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500&q=80", audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3", duration: "3:30", explicit: false },
        ];

        const MOCK_PLAYLIST_FR = { id: "fr", title: "FR", author: "nuhi", duration: "9 h 15 m", tracks: MOCK_TRACKS };

        const MOCK_ARTIST = {
            id: "nono", name: "NONO LA GRINTA", listeners: "4,8 M auditeurs mensuels", image: "https://images.unsplash.com/photo-1501612780327-45045538702b?w=800&q=80",
            topTracks: [
                { id: 5, title: "LOVE YOU", artist: "NONO LA GRINTA", image: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=200&q=80", plays: "141 749 293" },
                { id: 6, title: "Paris", artist: "NONO LA GRINTA", image: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=200&q=80", plays: "156 911 895" },
                { id: 7, title: "AVEC MOI", artist: "NONO LA GRINTA", image: "https://images.unsplash.com/photo-1493225457124-a1a2a5f5c518?w=200&q=80", plays: "73 806 667" }
            ]
        };

        // --- MAIN APP ---
        function App() {
            const [currentTab, setCurrentTab] = useState('home');
            const [currentScreen, setCurrentScreen] = useState('main');
            const [selectedItem, setSelectedItem] = useState(null);
            
            const [currentTrack, setCurrentTrack] = useState(MOCK_TRACKS[0]);
            const [isPlaying, setIsPlaying] = useState(false);
            const [progress, setProgress] = useState(0);
            const [isPlayerOpen, setIsPlayerOpen] = useState(false);
            
            // Interaction States
            const [isLiked, setIsLiked] = useState(false);
            const [isShuffle, setIsShuffle] = useState(false);
            const [isRepeat, setIsRepeat] = useState(false);
            const [isDownloaded, setIsDownloaded] = useState(false);
            
            // Toast System
            const [toast, setToast] = useState(null);
            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(null), 2500);
            };
            
            const audioRef = useRef(null);

            useEffect(() => { document.getElementById('loader').style.display = 'none'; }, []);

            useEffect(() => {
                if (audioRef.current) {
                    if (isPlaying) {
                        audioRef.current.play().catch(e => console.log("Play failed", e));
                    } else {
                        audioRef.current.pause();
                    }
                }
            }, [isPlaying, currentTrack]);

            const handleTimeUpdate = () => {
                if (audioRef.current) {
                    const p = (audioRef.current.currentTime / audioRef.current.duration) * 100;
                    setProgress(p || 0);
                }
            };

            const handleProgressChange = (e) => {
                const p = e.target.value;
                setProgress(p);
                if (audioRef.current) {
                    audioRef.current.currentTime = (p / 100) * audioRef.current.duration;
                }
            };

            const playTrack = (track) => {
                setCurrentTrack(track);
                setIsPlaying(true);
                setIsLiked(false); // Reset like state on new track
            };

            const navigateToPlaylist = (playlist) => { setSelectedItem(playlist); setCurrentScreen('playlist'); };
            const navigateToArtist = (artist) => { setSelectedItem(artist); setCurrentScreen('artist'); };
            const goBack = () => { setCurrentScreen('main'); setSelectedItem(null); };

            const renderScreen = () => {
                if (currentScreen === 'playlist') return <PlaylistScreen playlist={selectedItem} onBack={goBack} onPlay={playTrack} currentTrack={currentTrack} showToast={showToast} />;
                if (currentScreen === 'artist') return <ArtistScreen artist={selectedItem} onBack={goBack} onPlay={playTrack} showToast={showToast} />;
                
                switch(currentTab) {
                    case 'home': return <HomeScreen onPlaylistClick={navigateToPlaylist} onArtistClick={navigateToArtist} showToast={showToast} />;
                    case 'search': return <SearchScreen showToast={showToast} />;
                    case 'library': return <LibraryScreen onPlaylistClick={navigateToPlaylist} showToast={showToast} />;
                    default: return <HomeScreen onPlaylistClick={navigateToPlaylist} onArtistClick={navigateToArtist} showToast={showToast} />;
                }
            };

            return (
                <div className="flex flex-col h-[100dvh] bg-black text-white relative overflow-hidden">
                    <audio ref={audioRef} src={currentTrack.audio} onTimeUpdate={handleTimeUpdate} onEnded={() => setIsPlaying(false)} />

                    {/* Global Toast Notification */}
                    {toast && (
                        <div className="fixed top-12 left-1/2 transform -translate-x-1/2 z-[100] animate-slide-down">
                            <div className="glass-extreme px-5 py-2.5 rounded-full text-sm font-semibold shadow-2xl flex items-center space-x-2 border-white/20">
                                <span className="w-2 h-2 rounded-full bg-[var(--spotify-green)]"></span>
                                <span>{toast}</span>
                            </div>
                        </div>
                    )}

                    <div className="flex-1 overflow-y-auto overflow-x-hidden relative" style={{ paddingBottom: '160px', paddingTop: 'var(--safe-top)' }}>
                        {renderScreen()}
                    </div>

                    <div className="absolute bottom-0 left-0 right-0 z-40 px-3 pb-[var(--safe-bottom)] pt-4">
                        {!isPlayerOpen && (
                            <div onClick={() => setIsPlayerOpen(true)} className="glass-extreme mx-auto max-w-md w-full rounded-2xl p-2.5 mb-3 flex items-center justify-between cursor-pointer active-scale">
                                <div className="flex items-center space-x-3 truncate">
                                    <div className="relative">
                                        <img src={currentTrack.image} className="w-11 h-11 rounded-lg object-cover shadow-md" alt="cover" />
                                        {isPlaying && <div className="absolute -bottom-1 -right-1 w-3 h-3 bg-green-500 rounded-full border-2 border-black animate-pulse"></div>}
                                    </div>
                                    <div className="flex flex-col truncate">
                                        <span className="text-sm font-bold truncate leading-tight">{currentTrack.title}</span>
                                        <span className="text-xs text-white/60 truncate leading-tight">{currentTrack.artist}</span>
                                    </div>
                                </div>
                                <div className="flex items-center space-x-3 pr-2">
                                    <button onClick={(e) => { e.stopPropagation(); setIsLiked(!isLiked); showToast(isLiked ? "Retiré des titres likés" : "Ajouté aux titres likés"); }} className={`active-scale transition-colors ${isLiked ? 'text-[var(--spotify-green)]' : 'text-white/60'}`}>
                                        <Heart size={20} fill={isLiked ? "currentColor" : "none"} />
                                    </button>
                                    <button onClick={(e) => { e.stopPropagation(); setIsPlaying(!isPlaying); }} className="text-white active-scale bg-white/10 p-1.5 rounded-full backdrop-blur-md">
                                        {isPlaying ? <Pause size={18} fill="currentColor" /> : <Play size={18} fill="currentColor" />}
                                    </button>
                                </div>
                            </div>
                        )}

                        <nav className="glass-nav-extreme rounded-[2rem] mx-auto max-w-md w-full flex justify-around items-center h-[68px] px-2">
                            <NavItem icon={HomeIcon} label="Accueil" active={currentTab === 'home'} onClick={() => { setCurrentTab('home'); goBack(); }} />
                            <NavItem icon={Search} label="Recherche" active={currentTab === 'search'} onClick={() => { setCurrentTab('search'); goBack(); }} />
                            <NavItem icon={Library} label="Bibliothèque" active={currentTab === 'library'} onClick={() => { setCurrentTab('library'); goBack(); }} />
                            <NavItem icon={Plus} label="Créer" onClick={() => showToast("Création de playlist bientôt disponible")} />
                        </nav>
                    </div>

                    {isPlayerOpen && (
                        <FullPlayer 
                            track={currentTrack} isPlaying={isPlaying} setIsPlaying={setIsPlaying} 
                            onClose={() => setIsPlayerOpen(false)} progress={progress} handleProgressChange={handleProgressChange}
                            isLiked={isLiked} toggleLike={() => setIsLiked(!isLiked)} 
                            isShuffle={isShuffle} toggleShuffle={() => setIsShuffle(!isShuffle)}
                            isRepeat={isRepeat} toggleRepeat={() => setIsRepeat(!isRepeat)}
                            isDownloaded={isDownloaded} toggleDownload={() => setIsDownloaded(!isDownloaded)}
                            showToast={showToast}
                        />
                    )}
                </div>
            );
        }

        // --- SCREENS ---

        function HomeScreen({ onPlaylistClick, onArtistClick, showToast }) {
            return (
                <div className="animate-fade-in pb-10">
                    <header className="px-5 pt-4 pb-6 flex justify-between items-center sticky top-0 z-30 bg-gradient-to-b from-black/80 to-transparent backdrop-blur-md">
                        <h1 className="text-3xl font-bold tracking-tight">Home</h1>
                        <div className="flex items-center space-x-2">
                            <button onClick={() => showToast("Menu des paramètres")} className="w-10 h-10 rounded-full glass-extreme flex items-center justify-center active-scale">
                                <Menu size={20} className="text-white" />
                            </button>
                            <button onClick={() => showToast("Profil utilisateur")} className="w-10 h-10 rounded-full glass-extreme flex items-center justify-center active-scale">
                                <UserIcon size={20} className="text-white" />
                            </button>
                        </div>
                    </header>

                    <section className="px-5 mb-8">
                        <div className="flex space-x-4 horizontal-scroll pb-4 -mx-5 px-5">
                            <div onClick={() => onArtistClick(MOCK_ARTIST)} className="min-w-[150px] w-[150px] cursor-pointer group">
                                <div className="relative w-full aspect-square rounded-xl overflow-hidden mb-2 shadow-2xl">
                                    <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=400&q=80" className="object-cover w-full h-full group-hover:scale-105 transition-transform duration-500" alt="EP" />
                                </div>
                                <p className="text-sm font-bold truncate">EP</p>
                                <p className="text-xs text-white/50 truncate">teenage dream</p>
                            </div>
                            <div onClick={() => onPlaylistClick(MOCK_PLAYLIST_FR)} className="min-w-[150px] w-[150px] cursor-pointer group">
                                <div className="relative w-full aspect-square rounded-xl overflow-hidden mb-2 shadow-2xl">
                                    <img src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=400&q=80" className="object-cover w-full h-full group-hover:scale-105 transition-transform duration-500" alt="Playlist" />
                                    <div className="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent flex flex-col justify-end p-3">
                                        <h3 className="text-white font-black text-xl leading-none tracking-tighter uppercase">RAP FR</h3>
                                    </div>
                                </div>
                                <p className="text-sm font-bold truncate">Playlist Rap FR</p>
                                <p className="text-xs text-white/50 truncate">Les classiques</p>
                            </div>
                            <div className="min-w-[150px] w-[150px]">
                                <div className="w-full aspect-square rounded-xl glass-extreme flex items-center justify-center mb-2 cursor-pointer active-scale" onClick={() => showToast("Découvrir de nouveaux sons")}>
                                    <Plus size={40} className="text-white/40" />
                                </div>
                            </div>
                        </div>
                    </section>

                    <section className="px-5 mb-8">
                        <div className="grid grid-cols-2 gap-2">
                            {[
                                { title: "Nouméa", bg: "bg-[#3e3e3e]", img: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=100&q=80" },
                                { title: "Titres likés", bg: "bg-gradient-to-br from-indigo-600 to-purple-800", img: "heart" },
                                { title: "Alex G", bg: "bg-[#5a3a22]", img: "https://images.unsplash.com/photo-1501612780327-45045538702b?w=100&q=80" },
                                { title: "a6el", bg: "bg-[#4a2e1e]", img: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=100&q=80" },
                                { title: "Mix 1", bg: "bg-[#3d1a14]", img: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=100&q=80" },
                                { title: "Theodora", bg: "bg-[#2a1b54]", img: "https://images.unsplash.com/photo-1493225457124-a1a2a5f5c518?w=100&q=80" },
                                { title: "FR", bg: "bg-[#2a2a2a]", img: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=100&q=80" },
                                { title: "KYKY", bg: "bg-[#2d2d2d]", img: "https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=100&q=80" },
                            ].map((item, i) => (
                                <div key={i} onClick={() => item.title === "FR" ? onPlaylistClick(MOCK_PLAYLIST_FR) : showToast(`Ouverture de : ${item.title}`)} className={`${item.bg} flex items-center rounded-lg overflow-hidden h-14 active-scale cursor-pointer relative shadow-lg border border-white/5`}>
                                    {item.img === "heart" ? (
                                        <div className="w-14 h-14 bg-gradient-to-br from-indigo-400 to-white flex items-center justify-center shrink-0">
                                            <Heart size={20} fill="white" stroke="white" />
                                        </div>
                                    ) : (
                                        <img src={item.img} className="w-14 h-14 object-cover shrink-0" alt={item.title} />
                                    )}
                                    <span className="text-xs font-bold px-2 line-clamp-2">{item.title}</span>
                                </div>
                            ))}
                        </div>
                    </section>
                </div>
            );
        }

        function SearchScreen({ showToast }) {
            const categories = [
                { title: "Musique", color: "bg-[#e13300]", img: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=200&q=80" },
                { title: "Podcasts", color: "bg-[#006450]", img: "https://images.unsplash.com/photo-1478737270239-2f02b77fc618?w=200&q=80" },
                { title: "Livres audio", color: "bg-[#1e3264]", img: "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=200&q=80" },
                { title: "Événements live", color: "bg-[#7358ff]", img: "https://images.unsplash.com/photo-1501281668745-f7f57925c3b4?w=200&q=80" },
                { title: "Pour vous", color: "bg-[#8d67ab]", img: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=200&q=80" },
                { title: "Sorties", color: "bg-[#1e6a4b]", img: "https://images.unsplash.com/photo-1493225457124-a1a2a5f5c518?w=200&q=80" },
                { title: "Hip-Hop", color: "bg-[#777777]", img: "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?w=200&q=80" },
                { title: "Pop", color: "bg-[#148a08]", img: "https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=200&q=80" },
            ];

            return (
                <div className="animate-fade-in px-5 pt-4 pb-10">
                    <header className="flex justify-between items-center mb-6">
                        <h1 className="text-3xl font-bold tracking-tight">Rechercher</h1>
                    </header>

                    <div className="relative mb-6">
                        <Search size={20} className="absolute left-4 top-1/2 transform -translate-y-1/2 text-black" />
                        <input 
                            type="text" 
                            placeholder="Que souhaitez-vous écouter ?" 
                            className="w-full bg-white text-black rounded-xl py-3.5 pl-12 pr-4 text-sm font-bold placeholder-gray-500 focus:outline-none focus:ring-4 focus:ring-white/20 transition-all shadow-lg"
                            onKeyDown={(e) => { if(e.key === 'Enter') showToast(`Recherche : ${e.target.value}`); }}
                        />
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                        {categories.map((cat, i) => (
                            <div key={i} onClick={() => showToast(`Explorer : ${cat.title}`)} className={`${cat.color} relative rounded-xl overflow-hidden aspect-[16/9] p-3 cursor-pointer active-scale shadow-lg`}>
                                <h2 className="text-white font-bold text-lg leading-tight w-2/3 z-10 relative text-shadow">{cat.title}</h2>
                                <img src={cat.img} className="absolute -right-4 -bottom-2 w-20 h-20 object-cover rotate-[25deg] shadow-2xl rounded-sm" alt={cat.title} />
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function LibraryScreen({ onPlaylistClick, showToast }) {
            const [activeFilter, setActiveFilter] = useState('Playlists');

            return (
                <div className="animate-fade-in px-5 pt-4 pb-10">
                    <header className="flex justify-between items-center mb-6">
                        <h1 className="text-3xl font-bold tracking-tight">Bibliothèque</h1>
                    </header>
                    
                    <div className="flex space-x-2 mb-6 overflow-x-auto">
                        {['Playlists', 'Artistes', 'Albums'].map(filter => (
                            <button 
                                key={filter}
                                onClick={() => setActiveFilter(filter)}
                                className={`px-4 py-1.5 text-sm font-bold rounded-full whitespace-nowrap transition-colors ${activeFilter === filter ? 'bg-[var(--spotify-green)] text-black' : 'bg-white/10 text-white hover:bg-white/20'}`}
                            >
                                {filter}
                            </button>
                        ))}
                    </div>

                    {activeFilter === 'Playlists' && (
                        <div className="space-y-4">
                            <div className="flex items-center space-x-4 cursor-pointer active-scale group" onClick={() => onPlaylistClick(MOCK_PLAYLIST_FR)}>
                                <div className="relative w-16 h-16 rounded-lg overflow-hidden shrink-0 shadow-xl border border-white/10">
                                    <div className="grid grid-cols-2 grid-rows-2 w-full h-full">
                                        <img src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=100&q=80" className="object-cover w-full h-full" alt="Cover 1"/>
                                        <img src="https://images.unsplash.com/photo-1501612780327-45045538702b?w=100&q=80" className="object-cover w-full h-full" alt="Cover 2"/>
                                        <img src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=100&q=80" className="object-cover w-full h-full" alt="Cover 3"/>
                                        <img src="https://images.unsplash.com/photo-1493225457124-a1a2a5f5c518?w=100&q=80" className="object-cover w-full h-full" alt="Cover 4"/>
                                    </div>
                                </div>
                                <div>
                                    <p className="text-white font-bold text-base group-hover:text-[var(--spotify-green)] transition-colors">FR</p>
                                    <p className="text-white/50 text-sm">Playlist • nuhi</p>
                                </div>
                            </div>

                            <div onClick={() => showToast("Ouverture des titres likés")} className="flex items-center space-x-4 cursor-pointer active-scale group">
                                <div className="w-16 h-16 rounded-lg overflow-hidden shrink-0 shadow-xl bg-gradient-to-br from-indigo-500 to-purple-800 flex items-center justify-center border border-white/10">
                                    <Heart size={28} fill="white" className="text-white" />
                                </div>
                                <div>
                                    <p className="text-white font-bold text-base group-hover:text-[var(--spotify-green)] transition-colors">Titres likés</p>
                                    <p className="text-white/50 text-sm">Playlist • Vous</p>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {activeFilter !== 'Playlists' && (
                        <div className="text-center text-white/40 py-10">
                            Aucun {activeFilter.toLowerCase()} trouvé.
                        </div>
                    )}
                </div>
            );
        }

        function PlaylistScreen({ playlist, onBack, onPlay, currentTrack, showToast }) {
            return (
                <div className="animate-fade-in pb-10">
                    <div className="relative w-full aspect-[4/3] max-h-[350px] overflow-hidden">
                        <div className="absolute inset-0 grid grid-cols-2 grid-rows-2">
                            <img src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=500&q=80" className="object-cover w-full h-full" alt="Mosaic 1"/>
                            <img src="https://images.unsplash.com/photo-1501612780327-45045538702b?w=500&q=80" className="object-cover w-full h-full" alt="Mosaic 2"/>
                            <img src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=500&q=80" className="object-cover w-full h-full" alt="Mosaic 3"/>
                            <img src="https://images.unsplash.com/photo-1493225457124-a1a2a5f5c518?w=500&q=80" className="object-cover w-full h-full" alt="Mosaic 4"/>
                        </div>
                        
                        <div className="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-[#121212]"></div>

                        <div className="absolute top-4 left-4 right-4 flex justify-between z-10 pt-[var(--safe-top)]">
                            <button onClick={onBack} className="w-10 h-10 rounded-full glass-extreme flex items-center justify-center active-scale text-white">
                                <ChevronLeft size={24} />
                            </button>
                            <button onClick={() => showToast("Options de la playlist")} className="w-10 h-10 rounded-full glass-extreme flex items-center justify-center active-scale text-white">
                                <MoreHorizontal size={24} />
                            </button>
                        </div>

                        <div className="absolute bottom-4 left-4 right-4 z-10">
                            <h1 className="text-5xl font-black mb-2 text-shadow">{playlist.title}</h1>
                            <div className="flex items-center space-x-2 text-sm text-white/90 font-medium text-shadow">
                                <div className="w-5 h-5 rounded-full bg-green-500 flex items-center justify-center text-[10px] text-black font-bold">N</div>
                                <span>{playlist.author}</span>
                                <span>•</span>
                                <span>{playlist.duration}</span>
                            </div>
                        </div>
                    </div>

                    <div className="px-5 py-6 flex items-center justify-between">
                        <button onClick={() => showToast("Mode aléatoire activé")} className="text-white/60 hover:text-white transition-colors active-scale">
                            <Shuffle size={24} />
                        </button>
                        <button onClick={() => onPlay(playlist.tracks[0])} className="w-16 h-16 bg-[var(--spotify-green)] rounded-full flex items-center justify-center text-black active-scale shadow-[0_0_30px_rgba(30,215,96,0.4)]">
                            <Play size={32} fill="currentColor" className="ml-1" />
                        </button>
                        <button onClick={() => showToast("Téléchargement démarré")} className="text-white/60 hover:text-white transition-colors active-scale">
                            <Download size={24} />
                        </button>
                    </div>

                    <div className="px-5">
                        {playlist.tracks.map((track, i) => {
                            const isActive = currentTrack.id === track.id;
                            return (
                                <div key={track.id} onClick={() => onPlay(track)} className="flex items-center py-2 group cursor-pointer active:bg-white/5 rounded-xl px-2 -mx-2 transition-colors">
                                    <div className="w-8 text-center text-white/40 text-sm font-bold group-hover:hidden">
                                        {isActive ? <span className="text-[var(--spotify-green)]">▶</span> : i + 1}
                                    </div>
                                    <div className="hidden group-hover:flex w-8 justify-center">
                                        <Play size={16} fill="white" className="text-white" />
                                    </div>
                                    
                                    <img src={track.image} className="w-11 h-11 rounded-md object-cover mx-3 shadow-md" alt="cover" />
                                    
                                    <div className="flex-1 min-w-0 pr-2">
                                        <p className={`text-base truncate font-bold ${isActive ? 'text-[var(--spotify-green)]' : 'text-white'}`}>{track.title}</p>
                                        <div className="flex items-center space-x-1.5 mt-0.5">
                                            {track.explicit && <span className="bg-white/20 text-white text-[9px] font-black px-1 rounded-sm">E</span>}
                                            <p className="text-sm text-white/50 truncate">{track.artist}</p>
                                        </div>
                                    </div>
                                    <button onClick={(e) => { e.stopPropagation(); showToast("Options du titre"); }} className="p-2">
                                        <MoreHorizontal size={20} className="text-white/40" />
                                    </button>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        function ArtistScreen({ artist, onBack, onPlay, showToast }) {
            return (
                <div className="animate-fade-in pb-10">
                    <div className="relative w-full h-[400px]">
                        <img src={artist.image} className="w-full h-full object-cover object-top" alt={artist.name} />
                        <div className="absolute inset-0 bg-gradient-to-b from-black/20 via-black/40 to-[#121212]"></div>
                        
                        <div className="absolute top-4 left-4 right-4 flex justify-between z-10 pt-[var(--safe-top)]">
                            <button onClick={onBack} className="w-10 h-10 rounded-full glass-extreme flex items-center justify-center active-scale text-white">
                                <ChevronLeft size={24} />
                            </button>
                            <button onClick={() => showToast("Options de l'artiste")} className="w-10 h-10 rounded-full glass-extreme flex items-center justify-center active-scale text-white">
                                <MoreHorizontal size={24} />
                            </button>
                        </div>

                        <div className="absolute bottom-0 left-0 w-full px-5 pb-6 bg-gradient-to-t from-[#121212] via-[#121212]/80 to-transparent pt-10">
                            <h1 className="text-5xl font-black mb-1 text-shadow uppercase leading-none" style={{fontFamily: 'Impact, sans-serif', letterSpacing: '-0.02em', transform: 'scaleY(1.1)', transformOrigin: 'bottom'}}>{artist.name}</h1>
                            <p className="text-white/80 text-sm font-medium mt-4">{artist.listeners}</p>
                        </div>
                    </div>

                    <div className="px-5 py-6 flex items-center space-x-6">
                        <button onClick={() => showToast("Mode aléatoire activé")} className="text-white/60 hover:text-white transition-colors active-scale">
                            <Shuffle size={24} />
                        </button>
                        <button onClick={() => onPlay(artist.topTracks[0])} className="w-16 h-16 bg-[var(--spotify-green)] rounded-full flex items-center justify-center text-black active-scale shadow-[0_0_30px_rgba(30,215,96,0.4)]">
                            <Play size={32} fill="currentColor" className="ml-1" />
                        </button>
                        <button onClick={() => showToast("Vous suivez maintenant l'artiste")} className="px-5 py-2 border border-white/30 rounded-full text-sm font-bold active-scale hover:border-white transition-colors">Suivre</button>
                    </div>

                    <div className="px-5">
                        <h2 className="text-xl font-bold mb-4 tracking-tight">Titres les plus écoutés</h2>
                        {artist.topTracks.map((track, i) => (
                            <div key={track.id} onClick={() => onPlay(track)} className="flex items-center py-3 group cursor-pointer active:bg-white/5 rounded-xl px-2 -mx-2 transition-colors">
                                <div className="w-8 text-center text-white/40 text-sm font-bold">{i + 1}</div>
                                <img src={track.image} className="w-12 h-12 rounded-md object-cover mx-3 shadow-md" alt="cover" />
                                <div className="flex-1 min-w-0">
                                    <p className="text-base text-white truncate font-bold">{track.title}</p>
                                    <div className="flex items-center space-x-2 mt-0.5">
                                        <span className="bg-white/20 text-white text-[9px] font-black px-1 rounded-sm">E</span>
                                        <p className="text-sm text-white/50 font-mono">{track.plays}</p>
                                    </div>
                                </div>
                                <button onClick={(e) => { e.stopPropagation(); showToast("Options du titre"); }} className="p-2">
                                    <MoreHorizontal size={20} className="text-white/40" />
                                </button>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function FullPlayer({ track, isPlaying, setIsPlaying, onClose, progress, handleProgressChange, isLiked, toggleLike, isShuffle, toggleShuffle, isRepeat, toggleRepeat, isDownloaded, toggleDownload, showToast }) {
            return (
                <div className="fixed inset-0 z-50 flex flex-col animate-slide-up bg-black">
                    <div className="absolute inset-0 overflow-hidden opacity-40">
                        <img src={track.image} className="w-full h-full object-cover blur-[100px] scale-150 saturate-[200%]" alt="bg" />
                        <div className="absolute inset-0 bg-black/60"></div>
                    </div>

                    <div className="relative z-10 flex flex-col h-full px-6 pb-[var(--safe-bottom)] pt-[var(--safe-top)]">
                        <div className="flex justify-between items-center py-4">
                            <button onClick={onClose} className="w-10 h-10 rounded-full glass-extreme flex items-center justify-center active-scale text-white">
                                <ChevronDown size={28} />
                            </button>
                            <span className="text-xs font-bold tracking-widest uppercase text-white/60">Lecture en cours</span>
                            <button onClick={() => showToast("Options de lecture")} className="w-10 h-10 rounded-full glass-extreme flex items-center justify-center active-scale text-white">
                                <MoreHorizontal size={24} />
                            </button>
                        </div>

                        <div className="flex-1 flex items-center justify-center py-6">
                            <div className="w-full aspect-square max-w-[340px] rounded-2xl overflow-hidden shadow-[0_30px_60px_rgba(0,0,0,0.8)] border border-white/10">
                                <img src={track.image} className="w-full h-full object-cover" alt={track.title} />
                            </div>
                        </div>

                        <div className="mb-6">
                            <div className="flex justify-between items-center mb-4">
                                <div className="min-w-0 pr-4">
                                    <h1 className="text-2xl font-bold truncate text-white">{track.title}</h1>
                                    <p className="text-lg text-white/60 truncate">{track.artist}</p>
                                </div>
                                <button onClick={() => { toggleLike(); showToast(isLiked ? "Retiré des titres likés" : "Ajouté aux titres likés"); }} className={`active-scale shrink-0 transition-colors ${isLiked ? 'text-[var(--spotify-green)]' : 'text-white/60'}`}>
                                    <Heart size={30} fill={isLiked ? "currentColor" : "none"} />
                                </button>
                            </div>
                            
                            <div className="flex items-center space-x-3 text-xs text-white/50 font-mono mb-1">
                                <span className="w-8">{Math.floor((progress / 100) * (225)) ? `${Math.floor(((progress / 100) * 225) / 60)}:${Math.floor(((progress / 100) * 225) % 60).toString().padStart(2, '0')}` : '0:00'}</span>
                                <div className="flex-1 flex items-center">
                                    <input type="range" min="0" max="100" value={progress} onChange={handleProgressChange} className="w-full h-1 appearance-none bg-white/20 rounded-full outline-none" style={{ background: `linear-gradient(to right, var(--spotify-green) ${progress}%, rgba(255,255,255,0.2) ${progress}%)` }} />
                                </div>
                                <span className="w-8 text-right">{track.duration}</span>
                            </div>
                        </div>

                        <div className="flex justify-between items-center mb-8 px-2">
                            <button onClick={() => { toggleShuffle(); showToast(isShuffle ? "Aléatoire désactivé" : "Aléatoire activé"); }} className={`active-scale transition-colors ${isShuffle ? 'text-[var(--spotify-green)]' : 'text-white/60'}`}>
                                <Shuffle size={24} />
                            </button>
                            <button onClick={() => showToast("Titre précédent")} className="text-white active-scale">
                                <SkipBack size={36} fill="currentColor" />
                            </button>
                            <button onClick={() => setIsPlaying(!isPlaying)} className="w-20 h-20 bg-white rounded-full flex items-center justify-center text-black active-scale shadow-[0_0_40px_rgba(255,255,255,0.3)]">
                                {isPlaying ? <Pause size={36} fill="currentColor" /> : <Play size={36} fill="currentColor" className="ml-2" />}
                            </button>
                            <button onClick={() => showToast("Titre suivant")} className="text-white active-scale">
                                <SkipForward size={36} fill="currentColor" />
                            </button>
                            <button onClick={() => { toggleRepeat(); showToast(isRepeat ? "Répétition désactivée" : "Répétition activée"); }} className={`active-scale transition-colors ${isRepeat ? 'text-[var(--spotify-green)]' : 'text-white/60'}`}>
                                <Repeat size={24} />
                            </button>
                        </div>

                        <div className="flex justify-between items-center px-6 text-white/50">
                            <button onClick={() => showToast("Paroles")} className="active-scale hover:text-white transition-colors"><Mic2 size={20} /></button>
                            <button onClick={() => showToast("Appareils connectés")} className="active-scale hover:text-white transition-colors"><MonitorSpeaker size={20} /></button>
                            <button onClick={() => showToast("File d'attente")} className="active-scale hover:text-white transition-colors"><ListMusic size={20} /></button>
                        </div>
                    </div>
                </div>
            );
        }

        function NavItem({ icon: Icon, label, active, onClick }) {
            return (
                <button onClick={onClick} className={`flex flex-col items-center justify-center space-y-1 w-16 h-full active-scale transition-all duration-300 ${active ? 'text-white' : 'text-white/40 hover:text-white/80'}`}>
                    <div className={`p-1.5 rounded-full transition-all ${active ? 'bg-[var(--spotify-green)]/20' : ''}`}>
                        <Icon size={22} strokeWidth={active ? 2.5 : 2} className={active ? 'text-[var(--spotify-green)]' : ''} />
                    </div>
                    <span className="text-[10px] font-bold">{label}</span>
                </button>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
